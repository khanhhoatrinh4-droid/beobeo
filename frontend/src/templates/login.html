<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng nhập — beobeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" />
  </head>
  <body class="auth-page">
    <a class="brand auth-brand" href="/"><span>b</span> beobeo</a>
    <main class="auth-card">
      <span class="eyebrow coral">CHÀO MỪNG BẠN TRỞ LẠI</span>
      <h1>Đăng nhập</h1>
      <p>Đăng nhập để đặt món và theo dõi đơn hàng của bạn.</p>
      <div class="auth-success" th:if="${param.registered}">
        Tạo tài khoản thành công. Hãy đăng nhập để tiếp tục.
      </div>
      <div class="auth-error" th:if="${error}" th:text="${error}"></div>
      <form method="post" th:action="@{/login}" class="auth-form">
        <label
          >Tên đăng nhập<input
            name="username"
            required
            autocomplete="username"
            autofocus /></label
        ><label
          >Mật khẩu<input
            name="password"
            type="password"
            required
            autocomplete="current-password" /></label
        ><button class="primary-button" type="submit">Đăng nhập</button>
      </form>
      <div class="auth-bottom">
        Chưa là thành viên? <a href="/register">Tạo tài khoản miễn phí</a>
      </div>
      <a class="auth-back" href="/">← Quay lại cửa hàng</a>
    </main>
  </body>
</html>
