<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng ký thành viên — beobeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" />
  </head>
  <body class="auth-page">
    <a class="brand auth-brand" href="/"><span>b</span> beobeo</a>
    <main class="auth-card">
      <span class="eyebrow green">THÀNH VIÊN beobeo</span>
      <h1>Tạo tài khoản</h1>
      <p>Đăng ký để đặt món nhanh và lưu thông tin giao hàng.</p>
      <form
        method="post"
        th:action="@{/register}"
        th:object="${registration}"
        class="auth-form"
      >
        <label
          >Họ và tên<input
            th:field="*{fullName}"
            required
            maxlength="150"
            autocomplete="name" /><small
            class="field-error"
            th:errors="*{fullName}"
          ></small></label
        ><label
          >Tên đăng nhập<input
            th:field="*{username}"
            required
            minlength="3"
            maxlength="100"
            autocomplete="username" /><small
            class="field-error"
            th:errors="*{username}"
          ></small></label
        ><label
          >Mật khẩu<input
            th:field="*{password}"
            type="password"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password" /><small class="field-hint"
            >Tối thiểu 8 ký tự.</small
          ><small class="field-error" th:errors="*{password}"></small></label
        ><label
          >Email <span class="optional">(không bắt buộc)</span
          ><input
            th:field="*{email}"
            type="email"
            maxlength="150"
            autocomplete="email" /></label
        ><label
          >Số điện thoại <span class="optional">(không bắt buộc)</span
          ><input
            th:field="*{phone}"
            type="tel"
            maxlength="30"
            autocomplete="tel" /></label
        ><button class="primary-button" type="submit">
          Đăng ký thành viên
        </button>
      </form>
      <div class="auth-bottom">
        Đã có tài khoản? <a href="/login">Đăng nhập</a>
      </div>
      <a class="auth-back" href="/">← Quay lại cửa hàng</a>
    </main>
  </body>
</html>
