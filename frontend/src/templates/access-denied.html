<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Không có quyền — beobeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" />
  </head>
  <body class="auth-page">
    <a class="brand auth-brand" href="/"><span>b</span> beobeo</a>
    <main class="auth-card">
      <span class="eyebrow coral">KHU VỰC QUẢN TRỊ</span>
      <h1>Bạn chưa có quyền truy cập</h1>
      <p>
        Trang quản trị chỉ dành cho tài khoản được cấp quyền ADMIN. Hãy đăng
        nhập bằng tài khoản quản trị hoặc quay lại cửa hàng.
      </p>
      <a class="primary-button access-button" href="/">Về cửa hàng</a>
      <form method="post" th:action="@{/logout}" class="denied-logout">
        <button type="submit">Đăng xuất tài khoản hiện tại</button>
      </form>
    </main>
  </body>
</html>
