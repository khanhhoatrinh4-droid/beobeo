<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — FASTY</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="/"><span>F</span> FASTY</a><main class="auth-card"><span class="eyebrow coral">CHÀO MỪNG BẠN TRỞ LẠI</span><h1>Đăng nhập</h1><p>Đăng nhập để đặt món và theo dõi đơn hàng của bạn.</p><div class="auth-success" th:if="${param.registered}">Tạo tài khoản thành công. Hãy đăng nhập để tiếp tục.</div><div class="auth-error" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/login}" class="auth-form"><label>Tên đăng nhập<input name="username" required autocomplete="username" autofocus></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button class="primary-button" type="submit">Đăng nhập</button></form><div class="auth-bottom">Chưa là thành viên? <a href="/register">Tạo tài khoản miễn phí</a></div><a class="auth-back" href="/">← Quay lại cửa hàng</a></main></body></html>
