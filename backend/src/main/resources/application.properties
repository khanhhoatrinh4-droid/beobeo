spring.application.name=fastfood-management
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fastfood_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Thymeleaf
spring.thymeleaf.cache=false
# Server
server.port=8080

# VNPay sandbox (set merchant credentials in environment; never commit secrets)
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}

# MoMo sandbox; set callback URLs to a public HTTPS address outside local development.
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/payment/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/payment/momo/ipn}

# ZaloPay sandbox; keys are issued after merchant sandbox registration.
zalopay.app-id=${ZALOPAY_APP_ID:0}
zalopay.key1=${ZALOPAY_KEY1:}
zalopay.key2=${ZALOPAY_KEY2:}
zalopay.endpoint=${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:8080/payment/zalopay/return}
zalopay.callback-url=${ZALOPAY_CALLBACK_URL:http://localhost:8080/payment/zalopay/callback}

# Optional local admin bootstrap. When configured, startup creates or promotes this account.
fasty.admin.username=${FASTY_ADMIN_USERNAME:}
fasty.admin.password=${FASTY_ADMIN_PASSWORD:}
